function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add("in"); io.unobserve(el); }
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Reveal({ as: Tag = "div", className = "", children, ...rest }) {
  const ref = useReveal();
  return <Tag ref={ref} className={`reveal ${className}`} {...rest}>{children}</Tag>;
}

function ProjectCard({ p, index, activeTag, setActiveTag }) {
  const dim = activeTag && !p.tags.includes(activeTag);
  return (
    <Reveal as="article" className={`card ${dim ? "dim" : ""}`}>
      <div className="card-head">
        <span className="card-num">{p.category}</span>
      </div>
      <h3>{p.title}</h3>
      <p className="summary">{p.summary}</p>
      {p.strip && (
        <div className="strip">
          {p.strip.map((node, i) => (
            <React.Fragment key={node}>
              <span className="node">{node}</span>
              {i < p.strip.length - 1 && <span className="arrow">→</span>}
            </React.Fragment>
          ))}
        </div>
      )}
      <dl className="fields">
        {p.fields.map(([dt, dd]) => (
          <React.Fragment key={dt}>
            <dt>{dt}</dt><dd>{dd}</dd>
          </React.Fragment>
        ))}
      </dl>
      {p.mock === "monitor" && <MonitorMock />}
      {p.mock === "cnab" && <CnabMock />}
      <div className="tags">
        {p.tags.map((t) => (
          <button
            key={t}
            type="button"
            className={`tag ${t === activeTag ? "active" : ""}`}
            onClick={() => setActiveTag(activeTag === t ? null : t)}
            aria-pressed={t === activeTag}
          >
            {t}
          </button>
        ))}
      </div>
    </Reveal>
  );
}
